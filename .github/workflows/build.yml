name: Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: canary
        type: choice
        options:
          - canary
          - beta
          - release
  push:
    branches: [ "main" ]
    tags:
      - "v*"
    paths:
      - ".github/workflows/build.yml"
      - "manager/app/**"
      - "neko/**"
      - "uapi/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"
  pull_request:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build.yml"
      - "manager/app/**"
      - "neko/**"
      - "uapi/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/**"
      - "gradlew"
      - "gradlew.bat"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: android-ndk-${{ env.NDK_VERSION }}

    - name: Install the Android NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        curl -fSL --retry 3 -o ndk.zip "$url"
        rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
        unzip -q ndk.zip
        mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
        rm -f ndk.zip

    # ncore and bootpatcher live under neko/ and are compiled by Gradle through
    # cargo-ndk, so the APK always carries a userspace runtime built from the
    # same checkout.
    - name: Set up Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustup target add aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: neko -> build/rust/target

    - name: Decode Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        set -euo pipefail
        if [ -z "${KEYSTORE_BASE64:-}" ]; then
          echo "release keystore unavailable; this build will be unsigned"
          rm -f release.keystore
          exit 0
        fi
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

    - name: Determine version channel
      id: version
      run: |
        set -euo pipefail
        version_name=""
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          channel="${{ github.event.inputs.channel }}"
        elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
          case "$GITHUB_REF_NAME" in
            *-beta*) channel=beta ;;
            *) channel=release ;;
          esac

          version_name="${GITHUB_REF_NAME#v}"
          base_version="$(sed -n 's/^#define[[:space:]]\+NKSU_VERSION[[:space:]]\+"\([^"]*\)".*/\1/p' uapi/version.h)"
          case "$channel" in
            release)
              [ "$version_name" = "$base_version" ] || {
                echo "release tag $GITHUB_REF_NAME does not match uapi version $base_version" >&2
                exit 1
              }
              ;;
            beta)
              case "$version_name" in
                "$base_version"-beta.*) ;;
                *)
                  echo "beta tag $GITHUB_REF_NAME does not match uapi version $base_version" >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
        else
          channel=canary
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
        echo "version channel: $channel"
        echo "version name: ${version_name:-generated}"

    - name: Build with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        VERSION_CHANNEL: ${{ steps.version.outputs.channel }}
        VERSION_NAME: ${{ steps.version.outputs.version_name }}
      run: |
        set -euo pipefail
        args=(-PversionChannel="$VERSION_CHANNEL")
        if [ -n "$VERSION_NAME" ]; then
          args+=("-PversionNameOverride=$VERSION_NAME")
        fi
        if [ "$VERSION_CHANNEL" != "canary" ]; then
          args+=("-PrequireReleaseSigning=true")
        fi
        ./gradlew assembleRelease --no-daemon "${args[@]}"

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ steps.version.outputs.channel }}
        path: manager/app/build/outputs/apk/release/*.apk
        archive: false
